name: Release Standalone Binaries

on:
  push:
    tags:
      - "v*"

jobs:
  build-and-release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform-name: linux
            binary-path: src-tauri/target/release/tbcpc-ide
            output-name: tbcpc-ide-linux
          - os: windows-latest
            platform-name: windows
            binary-path: src-tauri/target/release/tbcpc-ide.exe
            output-name: tbcpc-ide-windows.exe
          - os: macos-latest
            platform-name: macos
            binary-path: src-tauri/target/release/tbcpc-ide
            output-name: tbcpc-ide-macos

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install Frontend Dependencies
        run: deno install

      - name: Build Svelte Frontend
        run: deno task build

      - name: Build Tauri Standalone Binary
        run: deno run -A npm:@tauri-apps/cli build --no-bundle

      - name: Prepare Binary Artifact
        shell: bash
        run: |
          mkdir dist-bin
          cp ${{ matrix.binary-path }} dist-bin/${{ matrix.output-name }}

      - name: Upload Binary to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist-bin/${{ matrix.output-name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
